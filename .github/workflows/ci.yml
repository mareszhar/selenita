name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR so we don't burn minutes on stale pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Lint, typecheck, and unit tests ────────────────────────────────────────
  # Runs independently — no build output needed. Fastest signal on a PR.
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # Lint needs newer Node, but core tests still prove the runtime floor.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Test
        run: bun run test

  # ── Build → post-build checks ───────────────────────────────────────────────
  # Runs in parallel with validate. Builds the dist, then verifies the package
  # is ready to publish from a consumer's perspective: consumer type check
  # and a full tarball-install smoke test.
  build-and-verify:
    name: Build & verify (Node ${{ matrix.node }})
    strategy:
      matrix:
        # tsdown requires 22.18+; the package gate tests the shipped core on 22.12.
        node: [22.18.0, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Consumer type check
        run: bun run test:types

      - name: Installed package gate
        run: bun run test:package
